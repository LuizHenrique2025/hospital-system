services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hospital_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hospital_system"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/hospital_system?schema=public&connection_limit=10&pool_timeout=20"
      FRONTEND_URL: "http://localhost:5173"
      JWT_SECRET: "replace-this-secret-before-production"
      JWT_EXPIRES_IN: "1h"
      LOG_LEVEL: "info"
      PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
